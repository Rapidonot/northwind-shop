[project]
name = "northwind-shop"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
# Every workspace service is listed here so `uv sync` installs all of them.
# When you add services/<name>/, add it here and under [tool.uv.sources]. data/ (FOUND-1) is
# a workspace member too.
dependencies = [
    "northwind-assistant",
    "northwind-backend",
    "northwind-common",
    "northwind-data",
    "northwind-evals",
    "northwind-gateway",
    "northwind-llm-replay",
    "northwind-rag",
]

[tool.uv.sources]
northwind-assistant = { workspace = true }
northwind-backend = { workspace = true }
northwind-common = { workspace = true }
northwind-data = { workspace = true }
northwind-evals = { workspace = true }
northwind-gateway = { workspace = true }
northwind-llm-replay = { workspace = true }
northwind-rag = { workspace = true }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "data", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["northwind_*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["services", "data", "evals", "tests"]
addopts = ["--strict-markers", "-m", "not integration and not e2e", "--import-mode=importlib"]
markers = [
    "req(id): the PRD requirement ID (e.g. RAG-03) whose acceptance criterion this test proves",
    "integration: needs the local stack (make up); run with `make test-integration`",
    "e2e: needs the real index and a recording; run with `make e2e`",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
