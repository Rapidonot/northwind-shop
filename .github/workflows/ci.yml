name: CI

# DEV-1 (decision 0020): once per PR push. A push trigger on branches ran every job a second time on the
# bare head; `ship` reads the PR's checks, which come from the pull_request run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# DEV-1 (decision 0020), the key from #12's plan: only `synchronize` runs share a group, so a new push
# cancels the run on the old SHA, which `ship` never reads. Every other run, the push to main included,
# gets its own group and is never cancelled. A plain workflow + ref group would let one run cancel another
# on the same head, and `ship` refuses `cancel`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'synchronize' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway credentials for an ephemeral CI database; not a secret.
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind-ci
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind -d northwind"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://northwind:northwind-ci@localhost:5432/northwind
      # CI never spends: replay only, and no API key exists in CI secrets (decision 0001).
      LLM_MODE: replay
      # Absolute: neither env values nor fastembed expand "~".
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Cache the embedding model (RAG-01 integration test)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install pgvector extension (compose does this via infra/db/init)
        run: psql "$DATABASE_URL" -f infra/db/init/001-extensions.sql
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy services data evals
      # Row 18a (M8): no paths, so CI scans the one default list `make scan-cassettes` scans (`cli.EVAL_ROOTS`,
      # cassettes, ledger and proxy log), data/enrichment and data/embeddings included. Pinned by test_scan_paths_18a.py.
      - name: Secret/PAN scan of cassettes, eval files, enrichment and frozen vectors (FOUND-2)
        run: uv run python -m northwind_llm_replay.cli scan
      - run: uv run pytest -n auto --dist loadgroup

  # DEV-1: the integration tests in their own job, beside `python`, so the two run at the same time. Still
  # serial: no xdist here. A red unit test cannot hide these results, because nothing here depends on it.
  python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway credentials for an ephemeral CI database; not a secret.
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind-ci
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind -d northwind"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://northwind:northwind-ci@localhost:5432/northwind
      # CI never spends: replay only, and no API key exists in CI secrets (decision 0001).
      LLM_MODE: replay
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Cache the embedding model (RAG-01 integration test)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install pgvector extension (compose does this via infra/db/init)
        run: psql "$DATABASE_URL" -f infra/db/init/001-extensions.sql
      - name: Integration tests
        run: uv run pytest -m integration

  # RAG-12: fails the build if a metric drops beyond tolerance or an eval is stale. Replay only.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway credentials for an ephemeral CI database; not a secret.
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind-ci
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind -d northwind"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://northwind:northwind-ci@localhost:5432/northwind
      LLM_MODE: replay
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # eval-integrity compares with origin/main
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Eval integrity
        run: uv run python -m northwind_evals.cli integrity
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install pgvector extension (compose does this via infra/db/init)
        run: psql "$DATABASE_URL" -f infra/db/init/001-extensions.sql
      - name: Build the index
        run: uv run python -m northwind_rag.cli --fixtures data/fixtures
      - name: Eval gate
        run: uv run python -m northwind_evals.cli gate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          # Throwaway credentials for an ephemeral CI database; not a secret.
          POSTGRES_USER: northwind
          POSTGRES_PASSWORD: northwind-ci
          POSTGRES_DB: northwind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northwind -d northwind"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://northwind:northwind-ci@localhost:5432/northwind
      LLM_MODE: replay
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install pgvector extension (compose does this via infra/db/init)
        run: psql "$DATABASE_URL" -f infra/db/init/001-extensions.sql
      - name: Install the browser
        run: pnpm --filter @northwind/portal exec playwright install --with-deps chromium
      - name: Playwright smoke test on a canned model
        run: make e2e-scripted
        env:
          PNPM: pnpm
      - name: Smoke test replayed from the assistant-smoke cassette
        run: make e2e
        env:
          PNPM: pnpm

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
