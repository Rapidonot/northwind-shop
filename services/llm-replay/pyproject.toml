[project]
name = "northwind-llm-replay"
version = "0.0.0"
description = "Record/replay proxy for every LLM call, cassette store, spend guard, secret/PAN scanner (FOUND-2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx2==2.16.0",
    "python-dotenv==1.2.4",
    "northwind-common",
]

[tool.uv.sources]
northwind-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
