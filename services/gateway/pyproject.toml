[project]
name = "northwind-gateway"
version = "0.0.0"
description = "Portal API gateway: health, chat SSE, cart, sessions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "northwind-assistant",
    "northwind-backend",
    "northwind-common",
    "northwind-rag",
    "psycopg[binary]>=3.3.7",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
northwind-assistant = { workspace = true }
northwind-backend = { workspace = true }
northwind-common = { workspace = true }
northwind-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
