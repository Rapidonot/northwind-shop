[project]
name = "northwind-common"
version = "0.0.0"
description = "Shared Python: LLM client factory (FOUND-2); later the error envelope, config, ids, audit stub"
requires-python = ">=3.12,<3.13"
# Pinned exactly: an SDK or bundled-CLI bump changes request bodies, which turns every cassette
# into a miss (decision 0001). Upgrade on purpose and re-record.
dependencies = ["anthropic==2.4.0", "claude-agent-sdk==0.2.178"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
