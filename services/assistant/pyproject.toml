[project]
name = "northwind-assistant"
version = "0.0.0"
description = "Shopper Assistant on the Claude Agent SDK (SA-02)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk",
    "northwind-common",
    "northwind-rag",
    "psycopg[binary]>=3.3.7",
]

[tool.uv.sources]
northwind-common = { workspace = true }
northwind-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
