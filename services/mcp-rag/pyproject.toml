[project]
name = "northwind-mcp-rag"
version = "0.0.0"
description = "northwind-rag MCP server: retrieve_context and the index manifest over HTTP (CC-10)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3,<3",
    "northwind-common",
    "northwind-rag",
    "psycopg[binary]>=3.3.7",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
northwind-common = { workspace = true }
northwind-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
