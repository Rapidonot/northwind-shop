[project]
name = "northwind-rag"
version = "0.0.0"
description = "RAG ingestion: chunking, metadata, embedding and the versioned index (RAG-01)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed>=0.7",
    "northwind-data",
    "psycopg[binary]>=3.3.7",
]

[tool.uv.sources]
northwind-data = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
