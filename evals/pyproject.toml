[project]
name = "northwind-evals"
version = "0.0.0"
description = "Evaluation harness: retrieval and answer metrics, baselines and the regression gate (RAG-12)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "northwind-common",
    "northwind-llm-replay",
    "northwind-rag",
    "psycopg[binary]>=3.3.7",
]

[tool.uv.sources]
northwind-common = { workspace = true }
northwind-llm-replay = { workspace = true }
northwind-rag = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
